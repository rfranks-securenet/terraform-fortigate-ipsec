name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
    - run: pip install checkov
    - uses: opentofu/setup-opentofu@v2
    - uses: aquasecurity/setup-trivy@v0.3.1
    - uses: pre-commit/action@v3.0.1
